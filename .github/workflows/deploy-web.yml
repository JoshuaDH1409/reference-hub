name: Build and deploy frontend to Azure Web App - referenciasai-web

on:
  push:
    branches:
      - main
    paths:
      - 'ReferenciaAI-Prototipo/frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: ReferenciaAI-Prototipo/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ReferenciaAI-Prototipo/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ReferenciaAI-Prototipo/frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ReferenciaAI-Prototipo/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'referenciasai-web'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
          package: .
